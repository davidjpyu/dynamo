#
# v1alpha1 mirror of deploy-chat-c12.yaml for clusters serving alpha-only DGD.
# Functionally identical to the v1beta1 deploy YAML; do not maintain divergent
# server parameters. Regenerate via /tmp/claude/v1beta1_to_v1alpha1.py if the
# primary YAML changes.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: ultra-vllm-p06h-agg1tp8-chat-c12-h200
  labels:
    app.kubernetes.io/name: ultra-vllm-p06h-agg1tp8-chat-c12-h200
    app.kubernetes.io/part-of: nemotron-ultra-phase0-v2-k8s
    nemotron-ultra.nvidia.com/backend: vllm-patch06-humming
    nemotron-ultra.nvidia.com/topology: agg1-tp8
    nemotron-ultra.nvidia.com/workload: chat
    nemotron-ultra.nvidia.com/precision-platform: NVFP4-on-H200
  annotations:
    nemotron-ultra.nvidia.com/status: agg1tp8-h200-moontrace-candidate
    nemotron-ultra.nvidia.com/not-pd-evidence: 'true'
    nemotron-ultra.nvidia.com/evidence-scope: aggregate_k8s_moontrace_not_pd_not_nixl_h200
    nemotron-ultra.nvidia.com/image-digest: sha256:bfa2d02fd0dd1daab3fd41e4f2acfd8b131c44b49f0a4282937b5716e04fc265
    nemotron-ultra.nvidia.com/action-id: K8S_VLLM_PATCH06_AGG1TP8_MOONTRACE_CHAT_C12_H200_R2000_SUSTAINED
    nemotron-ultra.nvidia.com/server-cap: server_cap_262144_full_trace
    nemotron-ultra.nvidia.com/operating-tps-gpu: '84.0'
    nemotron-ultra.nvidia.com/operating-tps-user: '56.0'
    nemotron-ultra.nvidia.com/operating-ttft-ms: '713'
    nemotron-ultra.nvidia.com/operating-itl-ms: '17.6'
spec:
  backendFramework: vllm
  pvcs:
    - name: nemotron-ultra-aiperf-artifacts
      create: false
    - name: shared-model-cache
      create: false
  envs:
    - name: HF_HOME
      value: /opt/models
    - name: HF_HUB_CACHE
      value: /opt/models/hub
    - name: HF_HUB_OFFLINE
      value: '1'
    - name: TRANSFORMERS_OFFLINE
      value: '1'
    - name: SERVED_MODEL_NAME
      value: nemotron-ultra-ea
    - name: MODEL_PATH
      value: /opt/models/patched/nemotron-ultra-ea-trtllm-tokenizer-patch-469ed01fa35dbc5e962a7d78bdbd9548872e9844
    - name: MODEL_CACHE_ROOT
      value: /opt/models
    - name: LOG_DIR
      value: /artifacts/logs
    - name: HOME
      value: /tmp
    - name: HF_MODULES_CACHE
      value: /tmp/hf_modules
    - name: XDG_CACHE_HOME
      value: /tmp/cache
    - name: TORCH_EXTENSIONS_DIR
      value: /tmp/torch_extensions
    - name: TRITON_CACHE_DIR
      value: /tmp/triton
    - name: VLLM_CACHE_ROOT
      value: /tmp/vllm
    - name: PYTHONHASHSEED
      value: '0'
    - name: VLLM_LOGGING_LEVEL
      value: INFO
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
    - name: VLLM_ALLREDUCE_USE_SYMM_MEM
      value: '0'
    - name: VLLM_ALLOW_CHUNKED_LOCAL_ATTN_WITH_HYBRID_KV_CACHE
      value: '1'
    - name: DYN_VLLM_APPEND_PREFILL_OUTPUT_TOKENS
      value: '0'
    - name: NCCL_IB_DISABLE
      value: '1'
    - name: NCCL_CUMEM_ENABLE
      value: '1'
    - name: NCCL_NVLS_ENABLE
      value: '1'
    - name: DYN_LOG
      value: info
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /opt/models
        - name: artifact-root
          mountPoint: /artifacts
      extraPodMetadata:
        labels:
          nemotron-ultra.nvidia.com/role: frontend
          nemotron-ultra.nvidia.com/workload: chat
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-secret
        volumes:
          - name: runtime-tmp
            emptyDir: {}
        mainContainer:
          name: main
          image: nvcr.io/nvstaging/nim/sungsooh:nemotron-ultra-vllm-reasoning-api-validated-tailfix-20260528T070932Z@sha256:bfa2d02fd0dd1daab3fd41e4f2acfd8b131c44b49f0a4282937b5716e04fc265
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - "# AGG topology: single worker, round-robin frontend (no KV-aware needed for single worker)\nexec python3 -m dynamo.frontend \\\n  --router-mode round-robin \\\n  --http-host 0.0.0.0 \\\n\
              \  --http-port 8000\n"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
    VllmWorker:
      componentType: worker
      replicas: 1
      sharedMemory:
        size: 64Gi
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: shared-model-cache
          mountPoint: /opt/models
        - name: artifact-root
          mountPoint: /artifacts
      resources:
        limits:
          gpu: '8'
        requests:
          gpu: '8'
          memory: 750Gi
          custom:
            ephemeral-storage: 20Gi
      extraPodMetadata:
        labels:
          nemotron-ultra.nvidia.com/role: aggregate-worker
          nemotron-ultra.nvidia.com/workload: chat
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-secret
        runtimeClassName: nvidia
        nodeSelector:
          nvidia.com/gpu.product: NVIDIA-H200
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: 'true'
            effect: NoSchedule
        volumes:
          - name: runtime-tmp
            emptyDir: {}
          - name: flashinfer-cubins
            emptyDir:
              medium: Memory
        mainContainer:
          name: main
          image: nvcr.io/nvstaging/nim/sungsooh:nemotron-ultra-vllm-reasoning-api-validated-tailfix-20260528T070932Z@sha256:bfa2d02fd0dd1daab3fd41e4f2acfd8b131c44b49f0a4282937b5716e04fc265
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command:
            - /bin/bash
            - -lc
          args:
            - "set -Eeuo pipefail\necho \"PRESTART_GPU_GUARD_BEGIN role=agg workload=chat platform=h200 ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\necho \"CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}\"\nnvidia-smi\
              \ -L\nnvidia-smi --query-gpu=index,uuid,memory.total,memory.used,memory.free,utilization.gpu --format=csv,noheader,nounits\nvisible_count=\"$(nvidia-smi -L | grep -c '^GPU ')\"\nif [ \"${visible_count}\"\
              \ -ne 8 ]; then\n  echo \"PRESTART_GPU_GUARD_FAIL class=prestart_gpu_visibility_count_mismatch role=agg workload=chat platform=h200 visible_count=${visible_count} expected=8\"\n  exit 96\n\
              fi\nmem_rows=\"$(nvidia-smi --query-gpu=index,uuid,memory.used,utilization.gpu --format=csv,noheader,nounits)\"\necho \"${mem_rows}\"\ndirty_count=\"$(printf '%s\\n' \"${mem_rows}\" | awk\
              \ -F',' '{gsub(/ /,\"\",$3); if (($3+0)>1024) c++} END{print c+0}')\"\nif [ \"${dirty_count}\" -ne 0 ]; then\n  echo \"PRESTART_GPU_GUARD_FAIL class=prestart_gpu_memory_dirty role=agg workload=chat\
              \ platform=h200 dirty_count=${dirty_count}\"\n  exit 97\nfi\ncompute_apps=\"$(nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_memory --format=csv,noheader,nounits || true)\"\
              \nif [ -n \"${compute_apps}\" ]; then\n  printf '%s\\n' \"${compute_apps}\"\n  echo \"PRESTART_GPU_GUARD_FAIL class=prestart_gpu_compute_apps_visible role=agg workload=chat platform=h200\"\
              \n  exit 98\nfi\necho \"PRESTART_GPU_GUARD_PASS role=agg workload=chat platform=h200\"\necho \"PRESTART_MODEL_CACHE_GUARD_BEGIN model_path=${MODEL_PATH}\"\nfor required in config.json ultra_v3_reasoning_parser.py\
              \ tokenizer_config.json chat_template.jinja; do\n  if [ ! -e \"${MODEL_PATH}/${required}\" ]; then\n    echo \"PRESTART_MODEL_CACHE_GUARD_FAIL class=missing_model_cache_prereq role=agg workload=chat\
              \ platform=h200 missing=${required}\" >&2\n    echo \"MODEL_PATH=${MODEL_PATH} is empty or partial. shared-model-cache PVC must be populated before this Deployment can run.\" >&2\n    echo\
              \ \"Run the prewarm Job to populate the PVC:\" >&2\n    echo \"  kubectl -n <namespace> apply -f prewarm/prewarm-model-cache.yaml\" >&2\n    echo \"See prewarm/README.md for prerequisites\
              \ + details.\" >&2\n    exit 94\n  fi\ndone\necho \"PRESTART_MODEL_CACHE_GUARD_PASS role=agg workload=chat platform=h200\"\nulimit -l unlimited\nexec python3 -m dynamo.vllm \\\n  --model \"\
              ${MODEL_PATH}\" \\\n  --served-model-name \"${SERVED_MODEL_NAME}\" \\\n  --tensor-parallel-size 8 \\\n  --trust-remote-code \\\n  --max-model-len 262144 \\\n  --max-num-seqs 256 \\\n  --max-num-batched-tokens\
              \ 32768 \\\n  --gpu-memory-utilization 0.85 \\\n  --block-size 64 \\\n  --mamba-cache-mode align \\\n  --enable-prefix-caching \\\n  --no-disable-hybrid-kv-cache-manager \\\n  --spec-method\
              \ nemotron_h_mtp \\\n  --spec-tokens 1 \\\n  --dyn-tool-call-parser qwen3_coder \\\n  --dyn-reasoning-parser nemotron3 \\\n  --reasoning-parser-plugin \"${MODEL_PATH}/ultra_v3_reasoning_parser.py\"\
              \ \\\n  --reasoning-parser nemotron_v3\n"
          env:
            - name: HF_HOME
              value: /opt/models
            - name: HF_MODULES_CACHE
              value: /tmp/hf_modules
            - name: TRITON_CACHE_DIR
              value: /tmp/triton
            - name: VLLM_CONFIG_ROOT
              value: /tmp/vllm-config
            - name: VLLM_CACHE_ROOT
              value: /tmp/vllm-cache
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
            runAsUser: 0
            runAsGroup: 0
          startupProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 30
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
            - name: flashinfer-cubins
              mountPath: /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/cubins/flashinfer
